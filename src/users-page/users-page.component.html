<app-user-create (createUser)="addUser($event)"/>
<app-users-filter (filterUser)="filterUsers($event)"/>
<p>{{ (filteredUsers$ | async)!.length | currect }}</p>
<div class="container-users bg-color">
  <div class="users-list">
    @for (user of filteredUsers$ | async; track user.id) {
        <div gradientHower>
          <app-user-card
            [user]="user"
            (deleteUser)="onDeleteUser(user)"
          />
        </div>
    }
  </div>
</div>
