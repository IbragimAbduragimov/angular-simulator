<div class="user-form">
  <form [formGroup]="userForm">
    <div>
      <label>
        Name
        <input gradientHover id="user-name" type="text" formControlName="name">
      </label>
    </div>
    <div>
      <label>
        Username
        <input gradientHover id="username" type="text" formControlName="username">
      </label>
    </div>
    <div>
      <label>
        Email
        <input gradientHover id="email" type="email" formControlName="email">
      </label>
    </div>
    <div formGroupName="address">
      <div>
        <label>
          Street
          <input gradientHover id="street" type="text" formControlName="street">
        </label>
      </div>
      <div>
        <label>
          Suite
          <input gradientHover id="suite" type="text" formControlName="suite">
        </label>
      </div>
      <div>
        <label>
          City
          <input gradientHover id="city" type="text" formControlName="city">
        </label>
      </div>
      <div>
        <label>
          Zipcode
          <input gradientHover id="zipcode" type="text" formControlName="zipcode">
        </label>
      </div>
      <div formGroupName="geo">
        <div>
          <label>
            Lat
            <input gradientHover id="lat" type="text" formControlName="lat">
          </label>
        </div>
        <div>
          <label>
            Lng
            <input gradientHover id="lng" type="text" formControlName="lng">
          </label>
        </div>
      </div>
    </div>
    <div>
      <label>
        Phone
        <input gradientHover id="phone" type="tel" formControlName="phone">
      </label>
    </div>
    <div>
      <label>
        Website
        <input gradientHover id="website" type="text" formControlName="website">
      </label>
    </div>
    <div formGroupName="company">
      <div>
        <label>
          Name
          <input gradientHover id="company-name" type="text" formControlName="name">
        </label>
      </div>
      <div>
        <label>
          Catch Phrase
          <input gradientHover id="catch-phrase" type="text" formControlName="catchPhrase">
        </label>
      </div>
      <div>
        <label>
          Bs
          <input gradientHover id="bs" type="text" formControlName="bs">
        </label>
      </div>
    </div>
  </form>
  <button boldOnHover id="bttn-form" type="button" (click)="onSubmitForm()" [disabled]="userForm.invalid">Зарегистрировать пользователя</button>
</div>
