@if (loading === true) {
<div class="card">
  <p-table [value]="skeleton" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th>title</th>
        <th>tags</th>
        <th>views</th>
      </tr>
      </ng-template>
      <ng-template #body let-product>
        <tr>
          <td><p-skeleton width="70%"/></td>
          <td><p-skeleton width="70%"/></td>
          <td><p-skeleton width="70%"/></td>
        </tr>
      </ng-template>
  </p-table>
</div>
} @else {
<div class="card">
    <p-contextmenu #cm [model]="items" (onHide)="selectedProduct = null" />
    <p-table [value]="(posts$ | async) ?? []"
      [paginator]="true"
      [rows]="rows"
      [tableStyle]="{ 'min-width': '50rem' }"
      [rowsPerPageOptions]="rowsPerPageOptions"
      (onPage)="onPageChange($event)"
      [totalRecords]="totalRecords"
      [showCurrentPageReport]="true"
      [(first)]="first"
      [tableStyle]="{ 'min-width': '50rem' }"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
      [lazy]="true"
      [(contextMenuSelection)]="selectedProduct"
      [contextMenu]="cm"
      dataKey="id"
      >
      <ng-template #header>
        <tr>
          <th>title</th>
          <th>tags</th>
          <th>views</th>
        </tr>
      </ng-template>
      <ng-template #body let-product>
        <tr [pContextMenuRow]="product" (dblclick)="onDblCkick(product.id)">
          <td>{{ product.title }}</td>
          <td>{{ product.tags }}</td>
            <td>{{ product.views }}</td>
        </tr>
        </ng-template>
    </p-table>
    <button (click)="redirectToCreate()">создать пост</button>
</div>
}
