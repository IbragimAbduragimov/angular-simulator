<form [formGroup]="loginForm">
  <div>
    <label>
      username
      <input id="username" type="text" formControlName="username" />
    </label>
  </div>
  <div>
    <label>
      password
      <input id="password" type="text" formControlName="password" />
    </label>
  </div>
</form>
<button (click)="login()">войти</button>
